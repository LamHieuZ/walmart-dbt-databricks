<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 600" width="1280" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <symbol id="tbl" viewBox="0 0 44 32">
      <rect x="1" y="1" width="42" height="30" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
      <line x1="15" y1="1" x2="15" y2="31" stroke="#333" stroke-width="1.2"/>
      <line x1="29" y1="1" x2="29" y2="31" stroke="#333" stroke-width="1.2"/>
      <line x1="1" y1="11" x2="43" y2="11" stroke="#333" stroke-width="1.2"/>
      <line x1="1" y1="21" x2="43" y2="21" stroke="#333" stroke-width="1.2"/>
    </symbol>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1280" height="600" fill="#ffffff"/>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#222">Walmart Data Pipeline</text>

  <!-- Source: CSV -->
  <rect x="50" y="90" width="180" height="110" rx="14" fill="#fff7e6" stroke="#333" stroke-width="1.6"/>
  <path d="M120,108 h30 l12,12 v40 h-42 z" fill="#ffffff" stroke="#333" stroke-width="1.6"/>
  <path d="M150,108 v12 h12" fill="none" stroke="#333" stroke-width="1.6"/>
  <text x="141" y="149" font-size="11" font-weight="700" fill="#2b8a3e" text-anchor="middle">CSV</text>
  <text x="140" y="186" font-size="15" font-weight="600" fill="#222" text-anchor="middle">CSV files (6)</text>

  <line x1="140" y1="200" x2="140" y2="278" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="150" y="244" font-size="12" fill="#555">load_data.py</text>

  <!-- Source: Neon -->
  <rect x="50" y="280" width="180" height="150" rx="14" fill="#e7f5ff" stroke="#333" stroke-width="1.6"/>
  <rect x="102" y="306" width="76" height="56" fill="#1c7ed6" stroke="#333" stroke-width="1.6"/>
  <ellipse cx="140" cy="362" rx="38" ry="10" fill="#1c7ed6" stroke="#333" stroke-width="1.6"/>
  <rect x="103" y="340" width="74" height="22" fill="#1c7ed6"/>
  <ellipse cx="140" cy="306" rx="38" ry="10" fill="#74c0fc" stroke="#333" stroke-width="1.6"/>
  <text x="140" y="342" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Postgres</text>
  <text x="140" y="396" font-size="15" font-weight="600" fill="#222" text-anchor="middle">Neon PostgreSQL</text>
  <text x="140" y="415" font-size="12" fill="#555" text-anchor="middle">schema raw</text>

  <!-- Divider -->
  <line x1="290" y1="70" x2="290" y2="560" stroke="#555" stroke-width="1.4" stroke-dasharray="7 6"/>

  <!-- CDC arrow -->
  <line x1="230" y1="355" x2="438" y2="355" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="262" y="341" width="146" height="28" rx="8" fill="#d0ebff" stroke="#333" stroke-width="1.4"/>
  <text x="335" y="360" font-size="12" font-weight="600" fill="#222" text-anchor="middle">CDC · Lakeflow Connect</text>

  <!-- Databricks container -->
  <rect x="440" y="60" width="800" height="470" rx="24" fill="none" stroke="#222" stroke-width="2"/>
  <text x="466" y="94" font-size="16" font-weight="700" fill="#c92a2a">Databricks</text>
  <text x="560" y="94" font-size="13" fill="#555">Unity Catalog · walmart</text>

  <!-- Bronze -->
  <rect x="465" y="230" width="155" height="170" rx="14" fill="#fdf0e6" stroke="#333" stroke-width="1.6"/>
  <use href="#tbl" xlink:href="#tbl" x="514" y="262" width="56" height="41"/>
  <text x="542" y="345" font-size="15" font-weight="700" fill="#a0522d" text-anchor="middle">Bronze</text>
  <text x="542" y="365" font-size="12" fill="#555" text-anchor="middle">raw Delta tables</text>
  <text x="542" y="382" font-size="11" fill="#777" text-anchor="middle">walmart.bronze</text>

  <!-- dbt container -->
  <rect x="645" y="110" width="580" height="385" rx="20" fill="#fffdf7" stroke="#e8890c" stroke-width="2"/>

  <!-- Silver -->
  <rect x="665" y="230" width="145" height="170" rx="14" fill="#eef3f8" stroke="#333" stroke-width="1.6"/>
  <use href="#tbl" xlink:href="#tbl" x="709" y="262" width="56" height="41"/>
  <text x="737" y="345" font-size="15" font-weight="700" fill="#495057" text-anchor="middle">Silver</text>
  <text x="737" y="365" font-size="12" fill="#555" text-anchor="middle">Incremental *_t</text>
  <text x="737" y="382" font-size="11" fill="#777" text-anchor="middle">walmart.silver</text>
  <line x1="620" y1="315" x2="663" y2="315" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- One Big Table -->
  <rect x="835" y="140" width="190" height="170" rx="14" fill="#f4f6f8" stroke="#333" stroke-width="1.6"/>
  <use href="#tbl" xlink:href="#tbl" x="845" y="175" width="54" height="40"/>
  <use href="#tbl" xlink:href="#tbl" x="903" y="175" width="54" height="40"/>
  <use href="#tbl" xlink:href="#tbl" x="961" y="175" width="54" height="40"/>
  <text x="930" y="258" font-size="15" font-weight="700" fill="#222" text-anchor="middle">One Big Table</text>
  <text x="930" y="278" font-size="11" fill="#777" text-anchor="middle">walmart.silver_b.obt_b</text>
  <path d="M810,280 C822,280 822,225 833,225" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Quality checks -->
  <rect x="835" y="328" width="190" height="40" rx="10" fill="#e7f5ff" stroke="#333" stroke-width="1.4"/>
  <text x="930" y="353" font-size="14" font-weight="600" fill="#222" text-anchor="middle">Quality checks · dbt test</text>

  <!-- Gold star schema -->
  <rect x="1038" y="140" width="178" height="230" rx="14" fill="#fff9db" stroke="#333" stroke-width="1.6"/>
  <line x1="1126" y1="250" x2="1080" y2="196" stroke="#333" stroke-width="1.3"/>
  <line x1="1126" y1="250" x2="1172" y2="196" stroke="#333" stroke-width="1.3"/>
  <line x1="1126" y1="250" x2="1080" y2="304" stroke="#333" stroke-width="1.3"/>
  <line x1="1126" y1="250" x2="1172" y2="304" stroke="#333" stroke-width="1.3"/>
  <use href="#tbl" xlink:href="#tbl" x="1062" y="183" width="36" height="26"/>
  <use href="#tbl" xlink:href="#tbl" x="1154" y="183" width="36" height="26"/>
  <use href="#tbl" xlink:href="#tbl" x="1062" y="291" width="36" height="26"/>
  <use href="#tbl" xlink:href="#tbl" x="1154" y="291" width="36" height="26"/>
  <rect x="1104" y="235" width="44" height="32" rx="5" fill="#b2f2bb" stroke="#333" stroke-width="1.6"/>
  <line x1="1119" y1="235" x2="1119" y2="267" stroke="#333" stroke-width="1.1"/>
  <line x1="1133" y1="235" x2="1133" y2="267" stroke="#333" stroke-width="1.1"/>
  <line x1="1104" y1="246" x2="1148" y2="246" stroke="#333" stroke-width="1.1"/>
  <line x1="1104" y1="256" x2="1148" y2="256" stroke="#333" stroke-width="1.1"/>
  <text x="1080" y="176" font-size="10" fill="#555" text-anchor="middle">dim_customers</text>
  <text x="1172" y="176" font-size="10" fill="#555" text-anchor="middle">dim_products</text>
  <text x="1080" y="330" font-size="10" fill="#555" text-anchor="middle">dim_stores</text>
  <text x="1172" y="330" font-size="10" fill="#555" text-anchor="middle">dim_employees</text>
  <text x="1126" y="283" font-size="10" font-weight="700" fill="#2b8a3e" text-anchor="middle" stroke="#fff9db" stroke-width="4" paint-order="stroke">fact_orders</text>
  <text x="1126" y="355" font-size="14" font-weight="700" fill="#b08800" text-anchor="middle">Gold · star schema</text>
  <path d="M1025,225 L1036,225" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="1126" y="392" font-size="11" fill="#555" text-anchor="middle">dims = dbt snapshot (SCD2)</text>

  <!-- dbt badge -->
  <rect x="1095" y="430" width="115" height="48" rx="12" fill="#ffe8dc" stroke="#333" stroke-width="1.6"/>
  <text x="1152" y="463" font-size="24" font-weight="800" fill="#ff694b" text-anchor="middle">dbt</text>

  <!-- Airflow badge -->
  <rect x="470" y="505" width="250" height="60" rx="14" fill="#f3f0ff" stroke="#333" stroke-width="1.6"/>
  <g transform="translate(505,535)">
    <path d="M0,0 L0,-20 L10,-6 z" fill="#017cee"/>
    <path d="M0,0 L20,0 L6,10 z" fill="#00ad46"/>
    <path d="M0,0 L0,20 L-10,6 z" fill="#e43921"/>
    <path d="M0,0 L-20,0 L-6,-10 z" fill="#04d659"/>
  </g>
  <text x="535" y="531" font-size="16" font-weight="700" fill="#222">Apache Airflow</text>
  <text x="535" y="551" font-size="12" fill="#555">DAG orchestrate · Docker</text>
</svg>
